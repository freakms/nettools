name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: nettools-tauri

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nettools-tauri/src-tauri

      - name: Install frontend deps
        run: npm install

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: nettools-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "NetTools Suite ${{ github.ref_name }}"
          releaseBody: |
            ## NetTools Suite ${{ github.ref_name }}

            ### Installation
            `.exe` herunterladen und ausführen.

            ### Systemanforderungen
            - Windows 10 / 11 (64-bit)
          releaseDraft: false
          prerelease: false
